<!DOCTYPE html>
<html>

<head>

<title>Admin Login</title>

<style>

body{
    background:#f0f2f5;
    font-family:Arial;
}

.login-box{

    width:350px;

    background:white;

    padding:30px;

    margin:100px auto;

    border-radius:10px;

    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h2{
    margin-bottom:20px;
}

input{

    width:100%;

    padding:12px;

    margin-bottom:15px;

    border:1px solid #ccc;
}

button{

    width:100%;

    padding:12px;

    background:#001f3f;

    color:white;

    border:none;

    cursor:pointer;
}

button:hover{
    background:#003366;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Admin Login</h2>

<form method="POST">

<input type="text"
name="username"
placeholder="Username"
required>

<input type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

</div>

</body>
</html>
