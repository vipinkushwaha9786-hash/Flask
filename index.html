<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIMACT</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f4f4f4;
}

/* HERO SECTION */

.hero{

    height:100vh;

    background:
    linear-gradient(rgba(0,0,0,0.6),
    rgba(0,0,0,0.6)),

    url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1400');

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;
    color:white;

    position:relative;
    padding:20px;
}

.hero-content{
    max-width:900px;
}

.hero h1{
    font-size:55px;
    margin-bottom:20px;
}

.hero p{
    font-size:22px;
    line-height:1.7;
    margin-bottom:30px;
}

.btn{

    display:inline-block;

    padding:14px 35px;

    background:#001f3f;

    color:white;

    text-decoration:none;

    border-radius:8px;

    transition:0.3s;
}

.btn:hover{
    background:#003366;
}

/* FEATURES */

.features{

    padding:80px 20px;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));

    gap:30px;
}

.card{

    background:white;

    padding:30px;

    border-radius:12px;

    text-align:center;

    box-shadow:0 4px 10px rgba(0,0,0,0.1);

    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card i{

    font-size:50px;

    color:#001f3f;

    margin-bottom:20px;
}

footer{

    background:#001f3f;

    color:white;

    text-align:center;

    padding:20px;
}

</style>

</head>

<body>

<section class="hero">

    <div class="hero-content">

        <h1>{{ content[1] | safe }}</h1>

        <p>{{ content[2] }}</p>

        <a href="/login" class="btn">
            Admin Login
        </a>

    </div>

</section>

<section class="features">

    <div class="card">

        <i class="fas fa-code"></i>

        <h2>Web Development</h2>

        <p>
        Learn frontend and backend professionally.
        </p>

    </div>

    <div class="card">

        <i class="fas fa-robot"></i>

        <h2>AI Technology</h2>

        <p>
        Learn latest AI and automation technologies.
        </p>

    </div>

    <div class="card">

        <i class="fas fa-globe"></i>

        <h2>Global Skills</h2>

        <p>
        Connect your skills with global opportunities.
        </p>

    </div>

</section>

<footer>

    <p>
    © 2026 NIMACT | All Rights Reserved
    </p>

</footer>

</body>
</html>
